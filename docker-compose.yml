services:
  apexcv:
    image: node:22-alpine
    container_name: apexcv-app
    restart: unless-stopped
    working_dir: /apexcv
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/apexcv/data/cv_builder.db
    volumes:
      - .:/apexcv
      - apexcv_data:/apexcv/data
    command: sh -c "mkdir -p /apexcv/data && npx next start -p 3001"

volumes:
  apexcv_data:
