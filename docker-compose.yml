services:
  apexcv:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apexcv-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/usr/src/app/data/cv_builder.db
    volumes:
      - apexcv_data:/usr/src/app/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: apexcv-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - apexcv

volumes:
  apexcv_data:

