services:
  apexcv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    container_name: apexcv-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/usr/src/app/data/cv_builder.db
    volumes:
      - apexcv_data:/usr/src/app/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: apexcv-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - apexcv

  # Self-hosted analytics (https://umami.is). The dashboard is bound to localhost only;
  # the app proxies just the tracker script and collect endpoint under /stats (next.config.mjs).
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: apexcv-umami
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me}
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - default
      # Shared with the other apps that report to this Umami (create once: docker network create analytics-net)
      - analytics-net

  umami-db:
    image: postgres:16-alpine
    container_name: apexcv-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  analytics-net:
    external: true

volumes:
  apexcv_data:
  umami_db:

